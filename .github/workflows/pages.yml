name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/diversa-estudio-juridico-page-skjiij"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Lex Go prototype
        working-directory: lex-go
        run: |
          npm ci
          npm run build
      - name: Assemble Pages site
        run: |
          mkdir -p _site
          shopt -s extglob dotglob
          cp -r !(lex-go|_site|.git|.github|node_modules) _site/
          mkdir -p _site/lex-go
          cp -r lex-go/dist/. _site/lex-go/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
